[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "podcast-scout"
version = "0.1.0"
description = "Personal podcast intelligence agent for retail & eCommerce product leaders"
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0.11",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "PyYAML>=6.0.1",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.2.2",
    "Jinja2>=3.1.4",
    "rapidfuzz>=3.9.0",
    "tenacity>=8.3.0",
    "python-dateutil>=2.9.0",
    "openai>=1.35.0",
    "tiktoken>=0.7.0",
    "rich>=13.7.0",
    "click>=8.1.7",
]

[project.scripts]
podcast-scout = "podcast_scout.cli:main"

[project.optional-dependencies]
transcription = [
    "openai-whisper>=20231117",
]
dev = [
    "pytest>=8.2.0",
    "pytest-httpx>=0.30.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.12",
    "types-python-dateutil>=2.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/podcast_scout"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
