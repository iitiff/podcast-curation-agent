name: CI

# The scheduled pipeline (daily.yml / weekly_synthesis.yml) checks out `ref: main`
# and only ever runs on a schedule, so nothing here can touch a live run. This
# workflow exists purely to verify a change before it reaches main.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push supersedes an in-flight run for the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · types · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # pyproject requires >=3.12

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh && echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        # --locked fails if uv.lock has drifted from pyproject.toml, so a
        # dependency edit that forgets to relock is caught here rather than
        # silently changing what the scheduled run installs.
        run: uv sync --locked --extra dev

      - name: Lint (ruff)
        run: uv run ruff check src/ tests/ scripts/

      - name: Typecheck (mypy strict)
        run: uv run mypy src/podcast_scout/

      - name: Tests
        run: uv run pytest -q

      - name: Example configs must stay valid
        # The public engine ships only example configs; if they stop parsing,
        # a fresh clone is broken and nothing else in this workflow would notice.
        run: |
          mkdir -p /tmp/example-config
          for f in preferences shows discovery_queries; do
            cp "config/$f.example.yaml" "/tmp/example-config/$f.yaml"
          done
          CONFIG_DIR=/tmp/example-config uv run podcast-scout validate

      - name: Engine must work when pip-installed
        # Templates resolve through importlib.resources. Running from a
        # different directory catches a regression to a cwd-relative path,
        # which would silently stop the briefing from rendering.
        run: |
          uv build --wheel -o dist
          uv venv /tmp/enginecheck
          VIRTUAL_ENV=/tmp/enginecheck uv pip install dist/*.whl
          cd /tmp && /tmp/enginecheck/bin/python -c "
          from podcast_scout.config import Settings
          s = Settings()
          assert s.templates_dir.exists(), 'packaged templates not found'
          assert s.brain_dir is None, 'brain must be off by default'
          assert s.briefing_dir == s.public_dir, 'briefing must default to public_dir'
          print('engine OK when installed as a dependency')
          "
