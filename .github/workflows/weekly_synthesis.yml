name: Weekly Synthesis

on:
  schedule:
    # Friday 06:00 UTC. Change to '0 6 * * 1' for Monday.
    - cron: '0 6 * * 5'
  workflow_dispatch:

# Without these the git push and Pages deploy both fail.
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  synthesis:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # pyproject requires >=3.12

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh && echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: uv sync

      - name: Run scout with synthesis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          PODCAST_INDEX_KEY: ${{ secrets.PODCAST_INDEX_KEY }}
          PODCAST_INDEX_SECRET: ${{ secrets.PODCAST_INDEX_SECRET }}
          WEB_SEARCH_API_KEY: ${{ secrets.WEB_SEARCH_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
          PAGES_BASE_URL: ${{ secrets.PAGES_BASE_URL }}
        run: uv run podcast-scout run --synthesis

      - name: Commit updated state
        run: |
          git config user.name "podcast-scout[bot]"
          git config user.email "podcast-scout[bot]@users.noreply.github.com"
          git add data/ || true
          git add -f public/ || true
          git diff --cached --quiet || git commit -m "chore: weekly synthesis state update [skip ci]"
          git pull --rebase origin main
          git push origin main

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

      - id: deploy
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
