# ────────────────────────────────────────────────────────────────────
# Non-podcast sources (EXAMPLE) — copy to sources.yaml
#
# The radar reaches here; the evergreen filter still judges everything that
# comes back. Articles carry no audio, so they appear in the briefing and the
# brain but never in the playable feeds.
#
# credibility and bias_notes default per source_type when omitted:
#   earnings-call   high    the only class that can contradict vendor marketing
#   research-paper  high    strong on mechanism, weak on production reality
#   trade-press     medium  access-driven; amplifies whoever gave the interview
#   vendor          low     pattern source only; discount performance claims
# ────────────────────────────────────────────────────────────────────

sources:
  # ── Trade press ──────────────────────────────────────────────────
  - name: "Modern Retail"
    url: "https://www.modernretail.co/feed/"
    source_type: trade-press
    tags: [retail, ecommerce]
    max_items_per_run: 5

  - name: "Retail Dive"
    url: "https://www.retaildive.com/feeds/news/"
    source_type: trade-press
    tags: [retail]

  # ── Research ─────────────────────────────────────────────────────
  # arXiv category feeds. cs.IR is information retrieval and recommender
  # systems -- the closest thing to a decisioning-architecture firehose.
  - name: "arXiv cs.IR"
    url: "http://export.arxiv.org/rss/cs.IR"
    source_type: research-paper
    tags: [architecture, research]
    max_items_per_run: 8

  # ── Vendor ───────────────────────────────────────────────────────
  # Kept deliberately, and deliberately discounted. Vendor writing is where
  # a pattern shows up first and where the evidence for it is weakest.
  - name: "Bloomreach Blog"
    url: "https://www.bloomreach.com/en/blog/rss.xml"
    source_type: vendor
    tags: [personalization, vendor]
    max_items_per_run: 3
    enabled: false   # turn on once you want the pattern signal

  # ── Earnings ─────────────────────────────────────────────────────
  # Not configured as feeds. Most IR sites publish no RSS at all, so earnings
  # comes from SEC EDGAR instead — see the `edgar:` block below.


# ────────────────────────────────────────────────────────────────────
# Earnings via SEC EDGAR
#
# Every US-listed company files quarterly results as an 8-K tagged with item
# 2.02, "Results of Operations and Financial Condition", and the numbers are in
# exhibit EX-99.1. EDGAR is therefore the feed that IR sites do not provide.
#
# REQUIRED: set SEC_USER_AGENT in the environment to a contact address, e.g.
#   SEC_USER_AGENT="Your Name (you@example.com)"
# The SEC refuses undeclared requests and returns a throttle page rather than
# an error. Unset simply disables this block — nothing is guessed.
#
# Earnings runs on a longer window than the daily lookback: a company reports
# once a quarter, so a 2-day window would surface nothing on all but four days
# of the year.
# ────────────────────────────────────────────────────────────────────

edgar:
  max_filings_per_company: 2

  companies:
    # Either `ticker` or `cik`. A ticker is resolved against the SEC's own
    # mapping in one request per run.
    - name: "Walmart"
      ticker: WMT
      tags: [competitive, market]

    - name: "Amazon"
      ticker: AMZN
      tags: [competitive, market]

    - name: "Shopify"
      ticker: SHOP
      tags: [competitive, market]
      enabled: false
