# =============================================================================
# Podcast Scout — Outside-Feed Discovery Query Templates
# =============================================================================
# These templates are used to generate weekly search queries for the
# "Outside Your Feed" discovery layer.
#
# The agent also generates dynamic queries from:
#   - your interest taxonomy (preferences.yaml)
#   - notable topics found in the followed-feed scan that week
#   - current AI and retail developments detected via web search
#
# Static templates here ensure baseline coverage of your watchlist topics.
# Max queries per run is controlled by config (default: 15).
# =============================================================================

static_templates:
  # Slot in a specific competitor or platform each week (rotated)
  - "podcast episode {competitor} strategy {year}"
  - "{competitor} executive interview podcast {year}"

  # Topic-driven discovery
  - "AI agents retail eCommerce podcast episode {year}"
  - "agentic commerce podcast episode"
  - "retail media network strategy podcast"
  - "personalization CRM product strategy podcast episode"
  - "marketplace seller platform podcast {year}"
  - "loyalty membership eCommerce podcast episode"
  - "product management AI-enabled teams podcast"
  - "omnichannel customer experience podcast {year}"

  # Guest-authority driven
  - "retail executive podcast interview {year}"
  - "CPO product leader podcast interview AI commerce"

# Dynamic query generation settings
dynamic_queries:
  # How many additional queries to generate from this week's episode topics
  from_episode_topics: 5
  # How many to generate from trending AI/retail signals via web search
  from_web_signals: 3

# Competitor rotation list — one is injected into template queries each week
competitor_rotation:
  - Amazon
  - Target
  - Costco
  - Instacart
  - Shopify
  - Google
  - OpenAI
  - Meta
  - Mercado Libre
  - Loblaw
  - TikTok Shop
  - Temu
  - Walmex
