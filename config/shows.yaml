# =============================================================================
# Podcast Scout — Per-Show Configuration Overrides
# =============================================================================
# Each entry overrides or supplements the OPML subscription list.
#
# Fields (all optional unless noted):
#   feed_url        : canonical RSS URL to use instead of the OPML entry
#   name            : display name override
#   priority        : float 0.5–2.0, overrides preferences.yaml show_prior
#   enabled         : true/false  (default: true)
#   language        : preferred language, e.g. "en"
#   transcript_source: hint for transcript fetcher: auto | podcastindex | webpage | youtube | none
#   max_episodes_per_run: integer cap (default: from config)
#   notes           : free-text memo visible in diagnostics
# =============================================================================

