# ────────────────────────────────────────────────────────────────────
# Podcast Scout — Per-Show Configuration Overrides
#
# Keys are matched against the show title from the OPML (case-insensitive,
# partial match allowed). The canonical_feed_url field, when set, replaces
# the URL from the OPML so you can point at a better or more stable feed.
#
# Fields (all optional):
#   canonical_feed_url   – override the feed URL from OPML
#   display_name         – friendly name used in outputs
#   priority             – float 0.0–1.0 (default from preferences.yaml show_priors)
#   enabled              – set false to skip this show entirely
#   language             – ISO 639-1, e.g. "en"
#   transcript_source    – auto | p20 | publisher | youtube | none
#   max_episodes_per_run – integer (default: 3)
#   notes                – free-form string for your own reference
# ────────────────────────────────────────────────────────────────────

shows:
  - match: "Lenny's Podcast"
    display_name: "Lenny's Podcast"
    max_episodes_per_run: 2
    language: en

  - match: "How I AI"
    display_name: "How I AI with Claire Vo"
    max_episodes_per_run: 2
    language: en

  - match: "Stratechery"
    display_name: "Stratechery"
    transcript_source: publisher
    max_episodes_per_run: 3
    notes: "Ben Thompson posts full transcripts on stratechery.com for members."

