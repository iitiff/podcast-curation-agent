# ────────────────────────────────────────────────────────────────────
# Podcast Scout — Per-Show Configuration (EXAMPLE)
#
# Copy to shows.yaml. Overrides category, feed URL, and per-run caps for
# individual shows. Anything not listed here still works — this is only
# for shows that need a correction.
# ────────────────────────────────────────────────────────────────────

shows:
  - match: "Acquired"              # substring matched against the show title
    display_name: "Acquired"
    category: ai_retail
    canonical_feed_url: "https://feeds.transistor.fm/acquired"
    max_episodes_per_run: 1        # long-form; cap so it can't flood a run
    notes: "3+ hour episodes."

  - match: "Lenny"
    display_name: "Lenny's Podcast"
    category: ai_retail
    max_episodes_per_run: 2

  - match: "No Priors"
    display_name: "No Priors"
    category: startup
    max_episodes_per_run: 2
