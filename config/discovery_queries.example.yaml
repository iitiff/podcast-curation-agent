# ────────────────────────────────────────────────────────────────────
# Podcast Scout — Discovery Query Seeds (EXAMPLE)
#
# Copy to discovery_queries.yaml. These static seeds are combined with
# queries generated from the current run's scan (topics, guests, entities).
# ────────────────────────────────────────────────────────────────────

discovery:
  max_queries: 15
  max_raw_candidates: 40
  max_deep_analysis_candidates: 10
  max_surfaced_outside_episodes: 3
  # Score an outside-feed episode must clear to displace a followed show.
  outside_quality_threshold: 60

static_seeds:
  - query: "AI agents product strategy podcast"
    enabled: true
    weight: 1.0

  - query: "product management craft interview podcast"
    enabled: true
    weight: 0.9

  - query: "platform strategy marketplace economics podcast"
    enabled: false      # set false to pause a seed without deleting it
    weight: 0.8
