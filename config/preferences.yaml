# ────────────────────────────────────────────────────────────────────
# Podcast Scout — User Preferences
# Edit this file to personalise the agent for your goals and interests.
# All settings here can be overridden by environment variables or CLI flags.
# ────────────────────────────────────────────────────────────────────

# —— Feed identity (appears in RSS and HTML briefing) ————————————————————
feed:
  title: "My Podcast Scout"
  description: "A ranked weekly listening queue curated by AI."
  owner_name: "Your Name"
  owner_email: ""   # optional; leave blank to omit from RSS
  language: "en-us"
  # URL where GitHub Pages will publish this repo
  # e.g. https://USERNAME.github.io/podcast-cpo-scout
  base_url: ""

# —— Per-category feed config —————————————————————————————————————
# Each key maps to a shows.yaml `category` value.
# slug      → filename: public/{slug}.xml
# title     → RSS <title> for that feed
# max_listen_fully / max_read_summary → output caps for that category
categories:
  ai_retail:
    slug: ai-retail
    title: "Podcast Scout — AI & Retail"
    description: "Curated AI, retail, and product episodes."
    max_listen_fully: 3
    max_read_summary: 5
  startup:
    slug: startup
    title: "Podcast Scout — Startup"
    description: "Curated startup and founder episodes."
    max_listen_fully: 2
    max_read_summary: 3
  chinese:
    slug: chinese
    title: "Podcast Scout — 中文播客"
    description: "精选中文科技与商业播客。"
    max_listen_fully: 2
    max_read_summary: 3

# —— Who you are (sent as context to the LLM ranker) ——————————————————
persona:
  role: "Senior product leader"
  focus: "AI, retail, eCommerce, customer experience, and product strategy"
  seniority: "senior"          # junior | mid | senior | executive
  preferred_depth: "strategic" # tactical | strategic | both

# —— Interest taxonomy (weight 0.0–1.0) ——————————————————————————
interests:
  artificial_intelligence: 1.0
  ai_agents_and_workflows: 1.0
  retail_and_ecommerce: 1.0
  agentic_commerce: 0.95
  walmart_competitors: 0.9
  customer_experience: 0.9
  personalization_and_crm: 0.9
  product_management_and_strategy: 0.95
  marketplace_and_seller_platforms: 0.85
  membership_and_loyalty: 0.85
  retail_media: 0.85
  organizational_design: 0.8
  supply_chain: 0.5
  fintech: 0.4
  general_startup: 0.6
  personal_development: 0.1

# —— Geographic priority (weight 0.0–1.0) ————————————————————————
geography:
  united_states: 1.0
  canada: 0.85
  mexico: 0.8
  latin_america: 0.6
  europe: 0.5
  asia_pacific: 0.5
  global: 0.7

# —— Episode length preferences ——————————————————————————————
length:
  # Minutes. Episodes shorter than min or longer than max get a mild penalty.
  preferred_min_minutes: 20
  preferred_max_minutes: 90
  hard_max_minutes: 240     # episodes over this get a stronger penalty
  # Maximum total listening hours to queue per week (Listen Fully slots)
  max_weekly_listen_hours: 4.0

# —— Classification thresholds ———————————————————————————————
classification:
  listen_fully_min_score: 75
  read_summary_min_score: 50
  # Allow model to override a boundary by at most this many points
  boundary_override_max: 5

# —— Weekly output caps (fallback if category not found) ——————————
output_caps:
  max_listen_fully: 3
  max_read_summary: 5
  max_outside_feed: 3
  max_total_surfaced: 10

# —— Show priors (0.0–1.0, default 0.5) ——————————————————————————
# A higher prior increases, but does not guarantee, ranking.
# An excellent episode from any show can outrank a mediocre high-prior episode.
show_priors:
  # AI / Retail
  "Lenny's Podcast": 0.85
  "How I AI with Claire Vo": 0.9
  "Stratechery": 0.85
  "Sharp Tech with Ben Thompson": 0.85
  "No Priors": 0.85
  "Hard Fork": 0.8
  "Retailgentic": 0.9
  "Future Commerce": 0.85
  "Modern Retail Podcast": 0.85
  "Behind the Numbers: Reimagining Retail": 0.85
  "Acquired": 0.85
  "AI + a16z": 0.85
  "The a16z Show": 0.8
  "Decoder": 0.8
  "Jason & Scot Show": 0.85
  "McKinsey on Consumer and Retail": 0.8
  "The Modern Customer Podcast": 0.8
  "Product Thinking": 0.8
  "The Growth Podcast": 0.7
  "The SaaS Podcast": 0.65
  "The Prof G Pod": 0.7
  "The Tim Ferriss Show": 0.6
  # Startup
  "Y Combinator Startup Podcast": 0.75
  "My First Million": 0.7
  "Invest Like the Best": 0.75
  "20VC with Harry Stebbings": 0.7
  "Founders Podcast": 0.75
  "Indie Hackers": 0.65
  # Chinese
