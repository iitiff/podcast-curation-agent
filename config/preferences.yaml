# ────────────────────────────────────────────────────────────────────
# Podcast Scout — User Preferences
# Edit this file to personalise the agent for your goals and interests.
# All settings here can be overridden by environment variables or CLI flags.
# ────────────────────────────────────────────────────────────────────

# —— Feed identity (appears in RSS and HTML briefing) ————————————————————
feed:
  title: "My Podcast Scout"
  description: "A ranked weekly listening queue curated by AI."
  owner_name: "Your Name"
  owner_email: ""   # optional; leave blank to omit from RSS
  language: "en-us"
  # URL where GitHub Pages will publish this repo
  base_url: ""

# —— Per-category feed config —————————————————————————————————————
categories:
  ai_retail:
    slug: ai-retail
    title: "Podcast Scout — AI & Retail"
    description: "Curated AI, retail, eCommerce, and product craft episodes."
    max_listen_fully: 3
    max_read_summary: 5
  startup:
    slug: startup
    title: "Podcast Scout — Startup"
    description: "Curated startup, founder, and business strategy episodes."
    max_listen_fully: 2
    max_read_summary: 3
  personal_growth:
    slug: personal-growth
    title: "Podcast Scout — Personal Growth"
    description: "Curated personal growth, mindfulness, and life philosophy episodes."
    max_listen_fully: 2
    max_read_summary: 3

# —— Who you are (sent as context to the LLM ranker) ——————————————————
persona:
  role: "Senior PM focused on career growth"
  focus: "Product strategy and craft, AI and emerging technology, and eCommerce — for a senior PM investing in career growth and product craft upskill"
  seniority: "executive"       # junior | mid | senior | executive
  preferred_depth: "strategic" # tactical | strategic | both

# —— Geographic priority (weight 0.0–1.0) ————————————————————————
geography:
  united_states: 1.0
  canada: 0.85
  mexico: 0.8
  latin_america: 0.6
  europe: 0.5
  asia_pacific: 0.5
  global: 0.7

# —— Episode length preferences ——————————————————————————————
length:
  preferred_min_minutes: 20
  preferred_max_minutes: 90
  hard_max_minutes: 240
  max_weekly_listen_hours: 4.0

# —— Classification thresholds ———————————————————————————————
classification:
  listen_fully_min_score: 75
  read_summary_min_score: 50
  boundary_override_max: 5

# —— Weekly output caps (fallback if category not found) ——————————
output_caps:
  max_listen_fully: 3
  max_read_summary: 5
  max_outside_feed: 3
  max_total_surfaced: 10

