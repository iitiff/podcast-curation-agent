  "声动早咖啡": 0.75
  "硅谷101": 0.8

# —— Topic exclusions ————————————————————————————————————
# Episodes that match these topics get heavily penalized (not hard-excluded).
topic_exclusions:
  - "sports betting"
  - "crypto speculation"
  - "NFT"
  - "day trading"
  - "celebrity gossip"

